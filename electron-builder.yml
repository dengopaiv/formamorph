appId: dev.jakejames.formamorph
productName: Formamorph
directories:
  output: release
# GitHub Releases is the update feed. electron-updater (Linux AppImage self-update) reads latest-linux.yml
# from the release; the Linux CI step publishes it directly. Windows uses a custom launcher swap, so its
# target doesn't rely on this — it's harmless for it.
publish:
  provider: github
  owner: JakeJamesDev
  repo: formamorph
files:
  - dist/**/*
  - electron/**/*
  # The fake llama-server and its recorded runs are test-only.
  - '!electron/fixtures/**'
  - '!electron/fakeLlamaServer.mjs'
# llama-server builds (scripts/fetchLlamaServer.mjs) ship as plain files in resources/llama-server/<build>/.
# Single icon source shared with the web favicon (public/icon.png, 512x512). electron-builder converts
# it to .ico (Windows) at build time and uses the PNG directly on Linux.
win:
  extraResources:
    - from: build-assets/llama-server/win-x64-vulkan
      to: llama-server/win-x64-vulkan
  # `dir` = the unpacked app payload only (release/win-unpacked), NOT a runnable installer. The Windows
  # distributable is assembled in CI: the Go launcher (launcher/) at the clean root + this payload under
  # `<root>/app`, which the launcher swaps in place on update (see electron/winUpdate.cjs + launcher/main.go).
  # This keeps data/models beside the root across updates and means SmartScreen only ever judges the launcher.
  target:
    - dir
  icon: public/icon.png
linux:
  extraResources:
    - from: build-assets/llama-server/linux-x64-vulkan
      to: llama-server/linux-x64-vulkan
    - from: build-assets/llama-server/linux-x64-cpu
      to: llama-server/linux-x64-cpu
  target:
    - AppImage
  category: Game
  artifactName: Formamorph-${version}.AppImage
  maintainer: Jake James <bennybroseph@gmail.com>
  icon: public/icon.png
